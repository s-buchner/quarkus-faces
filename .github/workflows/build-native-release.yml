name: Build Native Binary for Koyeb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # Required to create/update GitHub Releases

jobs:
  build-native:
    runs-on: ubuntu-latest # 16 GB RAM
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Quarkus Native Executable
        run: |
          ./mvnw package -Dnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-25 \
            -Dquarkus.native.native-image-xmx=10g

      - name: Package native runner and libraries
        run: |
          mkdir -p dist
          cp target/*-runner dist/application
          cp target/*.so dist/ 2>/dev/null || true
          cp target/*.properties dist/ 2>/dev/null || true
          tar -czvf quarkus-native-bundle.tar.gz -C dist .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-binary
          name: Latest Native Binary
          prerelease: true
          make_latest: false
          files: quarkus-native-bundle.tar.gz
